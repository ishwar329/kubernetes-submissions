apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: counter-storage
          persistentVolumeClaim:
            claimName: ping-pong-counter-claim

      containers:
        - name: ping-pong
          image: ping-pong:2.7
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: counter-storage
              mountPath: /usr/src/app/files
          ports:
            - containerPort: 8080
